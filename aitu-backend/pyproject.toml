[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitu-backend"
version = "0.1.0"
description = "Parse custom piano notation and serve sparse-COO JSON scores for aitu-frontend."
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.3.0",
    "pydantic>=2.9.0",
    "numpy>=2.4.5",
    "scipy>=1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitu_backend"]

[tool.hatch.build.targets.sdist]
include = ["src/aitu_backend", "README.md", "pyproject.toml"]
