[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitu-backend"
version = "0.1.0"
description = "Parse custom piano notation and serve sparse-COO JSON scores for aitu-frontend."
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.3.0",
    "pydantic>=2.9.0",
    "numpy>=2.4.5",
    "scipy>=1.17.1",
    "tqdm>=4.67.0",
    "python-multipart>=0.0.20",
    "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
# Transcription models. Kept out of the base install only because torch is a
# ~200 MB download; nothing here pins an old version.
#   uv sync --extra transcription
#
# Verified against the packages themselves (2026-07):
#   * piano_transcription_inference 0.0.6 requires matplotlib, mido, librosa,
#     torchlibrosa — and does NOT pin torch, contrary to the task file's note.
#   * torch >=2.13 ships macOS arm64 wheels for cp310-cp314, so Python 3.12
#     (this project's pin) is fully supported on Apple Silicon.
#   * On Apple Silicon the model runs on the CPU: the package only moves itself
#     to a device when the string contains "cuda". See transcription/engine.py.
transcription = [
    "piano_transcription_inference>=0.0.6",
    "torch>=2.4",
    "librosa>=0.10",
]

# Transkun 2 — the second real engine, for comparing against ByteDance by ear.
#   uv sync --extra transkun
#
# Verified against the package itself (2026-08):
#   * transkun 2.0.1 ships its own weights inside the wheel
#     (`transkun/pretrained/2.0.pt`), so there is no download step and no
#     checkpoint path to configure.
#   * It pulls a wide tail — torchaudio, tensorboard, seaborn, matplotlib,
#     pydub, sox, soxr, ncls — because the published wheel does not separate
#     its training dependencies from its inference ones. Nothing here is
#     imported by `TranskunEngine`; the weight is the download size, not a
#     conflict.
#   * `sox` (pysox) builds from source and fails against setuptools older than
#     ~60 with `AttributeError: install_layout`. uv provides a modern one, so
#     this only bites in a hand-rolled venv.
#   * `librosa` is listed again on purpose: the engine loads and resamples the
#     WAV with it rather than transkun's own pydub path, which needs ffmpeg.
transkun = [
    "transkun>=2.0.1",
    "torch>=2.4",
    "librosa>=0.10",
]

# NOTE: there is deliberately no `basic-pitch` extra.
#
# basic-pitch 0.4.0 (the newest) pins `tensorflow(-macos) >=2.4.1,<2.15.1`, and
# cp312 wheels for tensorflow only begin at 2.16.1 — on macOS *and* Linux. So it
# cannot be installed on Python 3.12 at all, and because `uv lock` resolves every
# extra for every platform, declaring it here makes the whole project
# unresolvable: even `uv sync --extra transcription` fails.
#
# The engine itself is still supported (`transcription/engine.py`); it just has
# to be installed into a separate Python 3.11 environment. See
# `notebooks/transcription-benchmark/README.md`.

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "black>=24.10.0",
    "flake8>=7.1.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-tqdm>=4.67.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitu_backend"]

[tool.hatch.build.targets.sdist]
include = ["src/aitu_backend", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
files = ["src/aitu_backend", "tests"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Permissive on purpose: this is a PoC. Tighten per-module as epics stabilize.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
