# Alembic, for a person at the command line (`uv run alembic revision --autogenerate -m "..."`).
# The app migrates by itself on start (aitu_backend/db/database.py); the URL comes from
# AITU_DATABASE_DIR, or `.database/` at the root of the repository.
[alembic]
script_location = src/aitu_backend/db/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
