<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The logo (public/logo-final-2.svg): SVG for the browsers that take it (black, white in dark
         mode), a PNG for the others (Safari), and the home screen icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The page supports both schemes; the user chooses one in the user menu
      (Light, Dark, System; implementation 02, Phase 4), and src/index.css gives
      the browser the chosen one. Declaring both here also keeps Chrome's Auto
      Dark Mode from re-tinting the page. The piano sheet stays white in both.
    -->
    <meta name="color-scheme" content="light dark" />
    <title>AImpromptu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
